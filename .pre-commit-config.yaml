# Local secret scanning before every commit.
#
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
#
# The hook scans only staged changes, so it does not fail on historical
# commits. The gitleaks-docker hook uses the Docker daemon that Flowsmith
# already requires for local development.
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker
