# Flowsmith production nginx configuration
# Replace the placeholder hostname/certificate paths before use.
#
# Stability notes:
# - 127.0.0.1 (not "localhost") avoids intermittent IPv6 connection failures.
# - Short connect timeout + next_upstream keeps deploys/restarts from hanging.
# - For true zero-downtime, run at least two app instances and list both in
#   the upstream block. A single upstream still has a brief 502 during restart.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream flowsmith_app {
    # Add a second server when running blue/green or multiple app replicas.
    server 127.0.0.1:8000 max_fails=3 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name flowsmith.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flowsmith.example.com;

    ssl_certificate     /etc/letsencrypt/live/flowsmith.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowsmith.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;
    keepalive_timeout 65s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://flowsmith_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Retry a dead/restarting upstream instead of returning 502 immediately.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    location /ws/ {
        proxy_pass http://flowsmith_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
