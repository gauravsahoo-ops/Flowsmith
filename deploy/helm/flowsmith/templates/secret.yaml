{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowsmith.secretName" . }}
  labels:
    {{- include "flowsmith.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  CREDENTIALS_ENCRYPTION_KEY: {{ required "secrets.credentialsEncryptionKey is required" .Values.secrets.credentialsEncryptionKey | quote }}
  REGISTRATION_BOOTSTRAP_TOKEN: {{ .Values.secrets.registrationBootstrapToken | quote }}
  DATABASE_URL: {{ include "flowsmith.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "postgresql.password is required" .Values.postgresql.password | quote }}
  {{- end }}
  {{- if or .Values.redis.enabled .Values.externalRedis.url }}
  REDIS_URL: {{ include "flowsmith.redisUrl" . | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ required "redis.password is required" .Values.redis.password | quote }}
  {{- end }}
  {{- if .Values.scim.enabled }}
  SCIM_BEARER_TOKEN: {{ required "scim.bearerToken is required when scim.enabled=true" .Values.scim.bearerToken | quote }}
  {{- end }}
  {{- if .Values.saml.spPrivateKey }}
  SAML_SP_PRIVATE_KEY: {{ .Values.saml.spPrivateKey | quote }}
  {{- end }}
  {{- if and .Values.ldap.enabled .Values.ldap.bindPassword }}
  LDAP_BIND_PASSWORD: {{ .Values.ldap.bindPassword | quote }}
  {{- end }}
{{- end }}
