global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "flowsmith"
    metrics_path: "/api/metrics"
    # Static service token, mounted from the Compose secret. Set METRICS_TOKEN
    # to a random value of at least 32 characters.
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "flowsmith"
