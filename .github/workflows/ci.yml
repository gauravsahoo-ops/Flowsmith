name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      CREDENTIALS_ENCRYPTION_KEY: YcUnzpKJ_p_IXRh5b_uXEx3I3wh7BkWD5WFfl5pJX_o=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pyright
      - name: Lint (ruff)
        run: ruff check app
      - name: Security audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Typecheck
        run: pyright
      - name: Tests (fast pass)
        run: pytest -q -m "not timing"
      - name: Tests (timing pass)
        run: pytest -q -m timing
      - name: Schema parity (alembic == models)
        run: python scripts/check_schema_parity.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      CREDENTIALS_ENCRYPTION_KEY: YcUnzpKJ_p_IXRh5b_uXEx3I3wh7BkWD5WFfl5pJX_o=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run migrations
        working-directory: backend
        run: |
          pip install alembic
          alembic upgrade head
      - name: Start backend server
        working-directory: backend
        run: |
          python -m app.serve &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t my-automation-tool:ci .
      - name: Run container
        run: |
          docker run -d --name mat --network host \
            -e JWT_SECRET=ci-test-secret-0123456789abcdef \
            -e CREDENTIALS_ENCRYPTION_KEY=YcUnzpKJ_p_IXRh5b_uXEx3I3wh7BkWD5WFfl5pJX_o= \
            -e DATABASE_URL=postgresql://automate:automate@localhost:5432/automate \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e PUBLIC_URL=http://127.0.0.1:8000 \
            my-automation-tool:ci
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=2)" 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy" >&2
          docker logs mat >&2 || true
          exit 1
      - name: Full-stack smoke
        run: python backend/scripts/ci_smoke.py
      - name: Cleanup
        if: always()
        run: docker rm -f mat || true
