name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CI_CREDENTIALS_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pyright ruff pip-audit
      - name: Lint (ruff)
        run: ruff check app
      - name: Security audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Typecheck
        run: pyright
      - name: Tests (fast pass)
        run: pytest -q -m "not timing" --cov=app --cov-report=term --cov-report=xml:coverage.xml
      - name: Tests (timing pass)
        run: pytest -q -m timing
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
      - name: Schema parity (alembic == models)
        run: python scripts/check_schema_parity.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit Tests
        run: npx vitest run --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CI_CREDENTIALS_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run migrations
        working-directory: backend
        run: |
          pip install alembic
          alembic upgrade head
      - name: Start backend server
        working-directory: backend
        run: |
          python -m app.serve &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t my-automation-tool:ci .
      - name: Run container
        env:
          CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          CI_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CI_CREDENTIALS_ENCRYPTION_KEY }}
        run: |
          umask 077
          {
            echo "JWT_SECRET=${CI_JWT_SECRET}"
            echo "CREDENTIALS_ENCRYPTION_KEY=${CI_CREDENTIALS_ENCRYPTION_KEY}"
            echo "DATABASE_URL=postgresql://automate:automate@localhost:5432/automate"
            echo "REDIS_URL=redis://localhost:6379/0"
            echo "PUBLIC_URL=http://127.0.0.1:8000"
          } > /tmp/mat-docker.env
          docker run -d --name mat --network host \
            --env-file /tmp/mat-docker.env \
            my-automation-tool:ci
          rm -f /tmp/mat-docker.env
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=2)" 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy" >&2
          docker logs mat >&2 || true
          exit 1
      - name: Full-stack smoke
        run: python backend/scripts/ci_smoke.py
      - name: Cleanup
        if: always()
        run: docker rm -f mat || true
