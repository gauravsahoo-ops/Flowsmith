name: Nightly load acceptance

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loadtest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CI_CREDENTIALS_ENCRYPTION_KEY }}
      RATE_LIMIT_PER_MINUTE: "20000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Migrate
        working-directory: backend
        run: |
          alembic upgrade head
      - name: Start stack
        working-directory: backend
        run: |
          nohup python -m app.serve > serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "server did not become healthy"; tail -50 serve.log; exit 1
      - name: Load acceptance (100 runs, conc 10, p95 <= 8s, errors <= 1%)
        working-directory: backend
        run: |
          python scripts/loadtest.py \
            --iterations 100 --concurrency 10 \
            --p95-ms 8000 --max-error-rate 0.01
      - name: Always show server log on failure
        if: failure()
        working-directory: backend
        run: tail -100 serve.log || true
