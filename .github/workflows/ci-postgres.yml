name: CI (Postgres)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: automation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: ./backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pyright

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Run backend tests (Postgres)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://app:testpass@localhost:5432/automation
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CI_CREDENTIALS_ENCRYPTION_KEY }}
          QUEUE_EMBEDDED_CONSUMER: "true"
        run: |
          .venv/bin/pytest -q

      - name: Run type checks
        working-directory: ./backend
        run: |
          .venv/bin/pyright app

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm run lint
          npx vitest run --coverage
          npm run build
