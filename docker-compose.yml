services:
  postgres:
    # pgvector-enabled PostgreSQL (16). Same official-image entrypoint;
    # the named volume below carries existing data across the swap.
    image: pgvector/pgvector:pg16
    container_name: mat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: automate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: automate
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automate -d automate"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: mat-redis
    restart: unless-stopped
    # Require a password when REDIS_PASSWORD is set (production).
    command: ["sh", "-c", "if [ -n \"$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru; else exec redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - mat-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  app:
    build: .
    container_name: mat-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://automate:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/automate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_BACKEND: redis
      QUEUE_EMBEDDED_CONSUMER: "false"
      JWT_SECRET: ${JWT_SECRET:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://flowsmith.dev.idslogic.net}
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://flowsmith.dev.idslogic.net,http://localhost:8000,http://localhost:5173}
      OBJECT_STORE_BACKEND: ${OBJECT_STORE_BACKEND:-local}
      OBJECT_STORE_LOCAL_PATH: ${OBJECT_STORE_LOCAL_PATH:-/app/backend/data/objects}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      SALESFORCE_REDIRECT_URI: ${SALESFORCE_REDIRECT_URI:-}
      SALESFORCE_LOGIN_URL: ${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}
      SALESFORCE_API_VERSION: ${SALESFORCE_API_VERSION:-v63.0}
      SALESFORCE_SCOPES: ${SALESFORCE_SCOPES:-refresh_token full api}
      DYNAMICS_CRM_CLIENT_ID: ${DYNAMICS_CRM_CLIENT_ID:-}
      DYNAMICS_CRM_CLIENT_SECRET: ${DYNAMICS_CRM_CLIENT_SECRET:-}
      DYNAMICS_CRM_REDIRECT_URI: ${DYNAMICS_CRM_REDIRECT_URI:-}
      DYNAMICS_CRM_TENANT_ID: ${DYNAMICS_CRM_TENANT_ID:-common}
      DYNAMICS_CRM_INSTANCE_URL: ${DYNAMICS_CRM_INSTANCE_URL:-}
      DYNAMICS_CRM_SCOPES: ${DYNAMICS_CRM_SCOPES:-offline_access https://admin.services.crm.dynamics.com/user_impersonation}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - mat-app-data:/app/backend/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, json; data=json.loads(urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=2).read()); assert data['data']['status']=='ready'\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    stop_grace_period: 30s

  worker:
    build: .
    container_name: mat-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://automate:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/automate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_BACKEND: redis
      QUEUE_EMBEDDED_CONSUMER: "false"
      JWT_SECRET: ${JWT_SECRET:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://flowsmith.dev.idslogic.net}
      APP_ENV: ${APP_ENV:-production}
      OBJECT_STORE_BACKEND: ${OBJECT_STORE_BACKEND:-local}
      OBJECT_STORE_LOCAL_PATH: ${OBJECT_STORE_LOCAL_PATH:-/app/backend/data/objects}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      SALESFORCE_REDIRECT_URI: ${SALESFORCE_REDIRECT_URI:-}
      SALESFORCE_LOGIN_URL: ${SALESFORCE_LOGIN_URL:-https://login.salesforce.com}
      SALESFORCE_API_VERSION: ${SALESFORCE_API_VERSION:-v63.0}
      SALESFORCE_SCOPES: ${SALESFORCE_SCOPES:-refresh_token full api}
      DYNAMICS_CRM_CLIENT_ID: ${DYNAMICS_CRM_CLIENT_ID:-}
      DYNAMICS_CRM_CLIENT_SECRET: ${DYNAMICS_CRM_CLIENT_SECRET:-}
      DYNAMICS_CRM_REDIRECT_URI: ${DYNAMICS_CRM_REDIRECT_URI:-}
      DYNAMICS_CRM_TENANT_ID: ${DYNAMICS_CRM_TENANT_ID:-common}
      DYNAMICS_CRM_INSTANCE_URL: ${DYNAMICS_CRM_INSTANCE_URL:-}
      DYNAMICS_CRM_SCOPES: ${DYNAMICS_CRM_SCOPES:-offline_access https://admin.services.crm.dynamics.com/user_impersonation}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    command: ["python", "-m", "app.queue.worker"]
    volumes:
      - mat-app-data:/app/backend/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; exit(0 if os.path.exists('/app/backend/tmp/worker_alive') else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s

  # Optional S3-compatible object storage for local development.
  # Enable with:  docker compose --profile s3 up -d
  # NOTE: minio/minio was deleted from Docker Hub on 2026-09-11 upstream;
  # bitnamilegacy/minio is the anonymously-pullable mirror (pinned).
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: mat-minio
    profiles: ["s3"]
    restart: unless-stopped
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-minioadmin}
    ports:
      # Loopback-only: MinIO is a dev/test service. Host ports are left
      # ephemeral ("" = auto-assign) to avoid collisions.
      - "127.0.0.1::9000"
      - "127.0.0.1::9001"
    volumes:
      - mat-minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ── Monitoring (enable with: docker compose --profile monitoring up -d) ──

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: mat-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=2GB"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mat-prometheus-data:/prometheus
    ports:
      # Loopback-only: Prometheus has no auth.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:12.4.12
    container_name: mat-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flowsmith.json
    volumes:
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - mat-grafana-data:/var/lib/grafana
    ports:
      # Loopback-only: admin credentials come from GRAFANA_* env vars
      # (no defaults — see .env.example).
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mat-postgres-data:
  mat-redis-data:
  mat-app-data:
  mat-minio-data:
  mat-prometheus-data:
  mat-grafana-data:
